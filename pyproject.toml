[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctxttl"
version = "0.2.1"
description = "A lifecycle-aware context compiler for long-running LLM agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CtxTTL Contributors" }]
license = { text = "Apache-2.0" }
keywords = ["llm", "agent", "context-management", "long-context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/qinghuanandejiangshi/CtxTTL-OSS"
Repository = "https://github.com/qinghuanandejiangshi/CtxTTL-OSS"
Issues = "https://github.com/qinghuanandejiangshi/CtxTTL-OSS/issues"

[project.scripts]
ctxttl = "ctxttl.__main__:main"
ctxttl-bench = "ctxttl.benchmarks.cli:main"
ctxttl-bench-audit = "ctxttl.benchmarks.audit_cli:main"
ctxttl-eval = "ctxttl.evaluation.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxttl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
