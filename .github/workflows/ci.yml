name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" -e "./packages/ctxttl-mcp[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Test
        timeout-minutes: 3
        run: python -m pytest -vv --durations=20 tests packages/ctxttl-mcp/tests
      - name: Build wheels
        if: matrix.python-version == '3.13'
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip wheel ./packages/ctxttl-mcp --no-deps --wheel-dir dist
