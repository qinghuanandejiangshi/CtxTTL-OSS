[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctxttl-mcp"
version = "0.1.0"
description = "A decoupled MCP control plane for CtxTTL Core."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CtxTTL Contributors" }]
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff==0.16.8",
]

[project.scripts]
ctxttl-mcp = "ctxttl_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxttl_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
